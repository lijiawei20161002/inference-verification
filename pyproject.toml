[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivgym"
version = "0.2.0"
description = "Check LLM inference behavior with token and timing evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["llm", "inference-verification", "model-auditing", "ai-safety"]

[project.urls]
Repository = "https://github.com/lijiawei20161002/inference-verification"
Documentation = "https://github.com/lijiawei20161002/inference-verification/blob/main/docs/README.md"
Issues = "https://github.com/lijiawei20161002/inference-verification/issues"

[project.optional-dependencies]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
audit = ["cryptography>=41", "rfc8785>=0.1.4"]
gpu = ["torch>=2.4", "transformers>=4.51,<5", "accelerate", "safetensors"]
test = ["pytest>=8"]

[project.scripts]
ivgym = "ivgym.cli:main"

[tool.setuptools.packages.find]
include = ["ivgym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
