[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivgym"
version = "0.1.0"
description = "Inference verification experiments and authenticated statistical audits"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
audit = ["cryptography>=41", "rfc8785>=0.1.4"]
gpu = ["torch>=2.4", "transformers>=4.51,<5", "accelerate", "safetensors"]
test = ["pytest>=8"]

[project.scripts]
ivgym = "ivgym.audit.cli:main"

[tool.setuptools.packages.find]
include = ["ivgym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
