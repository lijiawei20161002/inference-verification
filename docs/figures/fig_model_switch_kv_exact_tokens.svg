   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c40" x="40.32" y="39.730437" transform="rotate(-0 40.32 39.730437)">Exact tokens can hide an invalid KV-cache handoff</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596a7a" x="40.32" y="71.117156" transform="rotate(-0 40.32 71.117156)">Model A → model B  •  Different weights  •  Exact arithmetic  •  Toy response: “cat runs”</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c40" x="63.36" y="126.17" transform="rotate(-0 63.36 126.17)">ASSUMED CONTRACT: switching models is allowed; B must receive a cache valid for B.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596a7a" x="63.36" y="147.544062" transform="rotate(-0 63.36 147.544062)">Rebuilding the observed prefix or using a validated conversion is permitted. Unvalidated reuse is not.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596a7a" x="63.36" y="202.619312" transform="rotate(-0 63.36 202.619312)">SHARED START</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563a6" x="420.48" y="209.339063" transform="rotate(-0 420.48 209.339063)">Model A emits “cat”</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563a6" x="887.04" y="208.736406" transform="rotate(-0 887.04 208.736406)">After processing “cat”: cache A</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #167358" x="420.48" y="259.781281" transform="rotate(-0 420.48 259.781281)">Exact token check 1: PASS</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563a6" x="887.04" y="259.781281" transform="rotate(-0 887.04 259.781281)">One-slot toy: K = 1, V = 2</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b23a47" x="63.36" y="334.085281" transform="rotate(-0 63.36 334.085281)">ACTUAL SERVER</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c40" x="63.36" y="367.193219" transform="rotate(-0 63.36 367.193219)">Switches A → B</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b23a47" x="63.36" y="393.756469" transform="rotate(-0 63.36 393.756469)">Skips cache rebuild</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #b23a47" transform="translate(397.882031 379.440875)">B reads cache A</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #b23a47" transform="translate(413.642969 397.245375)">K = 1, V = 2</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c40" x="789.12" y="388.012" transform="rotate(-0 789.12 388.012)">runs: 3   sleeps: 2</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #167358" x="1025.28" y="388.895" transform="rotate(-0 1025.28 388.895)">“runs”</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596a7a" x="460.8" y="333.809344" transform="rotate(-0 460.8 333.809344)">CARRIED CACHE</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596a7a" x="789.12" y="333.809344" transform="rotate(-0 789.12 333.809344)">B’S EXACT LOGITS</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596a7a" x="1025.28" y="333.809344" transform="rotate(-0 1025.28 333.809344)">SERVED TOKEN</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b23a47" x="460.8" y="477.059188" transform="rotate(-0 460.8 477.059188)">Cache values differ: 2 ≠ 4</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #167358" x="1025.28" y="477.059188" transform="rotate(-0 1025.28 477.059188)">Tokens match ✓</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167358" x="63.36" y="532.805281" transform="rotate(-0 63.36 532.805281)">TOKEN VERIFIER</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c40" x="63.36" y="565.864391" transform="rotate(-0 63.36 565.864391)">Replays prefix “cat”</text>
   </g>
   <g id="text_23">
    <text style="font-size: 11.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a96312" x="63.36" y="592.476469" transform="rotate(-0 63.36 592.476469)">Rebuilds under B</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #a96312" transform="translate(375.133125 578.160875)">B reads fresh cache B</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #a96312" transform="translate(413.642969 595.965375)">K = 1, V = 4</text>
   </g>
   <g id="text_25">
    <text style="font-size: 12.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #172c40" x="789.12" y="586.732" transform="rotate(-0 789.12 586.732)">runs: 5   sleeps: 2</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #167358" x="1025.28" y="587.615" transform="rotate(-0 1025.28 587.615)">“runs”</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596a7a" x="460.8" y="532.529344" transform="rotate(-0 460.8 532.529344)">RECOMPUTED CACHE</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596a7a" x="789.12" y="532.529344" transform="rotate(-0 789.12 532.529344)">B’S EXACT LOGITS</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #596a7a" x="1025.28" y="532.529344" transform="rotate(-0 1025.28 532.529344)">EXPECTED TOKEN</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #167358" x="576" y="690.256437" transform="rotate(-0 576 690.256437)">Both exact token checks pass. They do not establish which cache the server used.</text>
   </g>
   <g id="text_31">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c40" x="51.84" y="741.755313" transform="rotate(-0 51.84 741.755313)">WHAT A STATE-AWARE CHECK ADDS</text>
   </g>
   <g id="text_32">
    <text style="font-size: 12.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c40" x="51.84" y="767.280406" transform="rotate(-0 51.84 767.280406)">With trusted handoff evidence, it rejects B reading A’s unvalidated cache. A legal rebuild must pass.</text>
   </g>
   <g id="text_33">
    <text style="font-size: 12.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596a7a" x="51.84" y="799.165625" transform="rotate(-0 51.84 799.165625)">Tokens alone still have a legal explanation: A → rebuild the prefix under B → “runs”.</text>
   </g>
   <g id="text_34">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596a7a" x="51.84" y="819.598094" transform="rotate(-0 51.84 819.598094)">This is a limit on verifying execution history, not a counterexample to FlashProve’s fixed-model output proof.</text>
   </g>
   <g id="text_35">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #596a7a" x="51.84" y="847.806563" transform="rotate(-0 51.84 847.806563)">Declared toy: one cached value v; B’s logits (runs, sleeps) = (v + 1, 2). Greedy decoding picks the larger logit. Not measured model outputs.</text>
   </g>
  </g>
 </g>
