name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numpy-core:
    name: NumPy core and laptop demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - name: Replay the README demo
        run: python examples/quickstart.py
      - name: Discover example strategies without a GPU
        run: python -m experiments.run --strategies examples/custom_strategies.py --list
      - name: Run core and artifact checks
        run: >-
          python -m pytest tests/ -q
          --ignore=tests/test_audit_protocol.py
          --ignore=tests/test_audit_conformance.py
          --ignore=tests/test_service.py

  service-and-audit:
    name: API and protocol / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[service,audit,test]'
      - run: python -m pytest tests/ -q
